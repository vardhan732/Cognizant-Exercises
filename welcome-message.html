<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Welcome Banner</title>

    <style>

       
        #welcomeBanner {
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
        }

       
        .highlight {
            background-color: yellow;
            font-weight: bold;
        }

    </style>

</head>

<body>

    
    <div id="welcomeBanner">

        <h1>Welcome Varadarshan Reddy!</h1>

        <p>
            Register now and get
            <span style="color:red; font-weight:bold;">
                50% OFF
            </span>
            on premium event passes.
        </p>

    </div>

    <br>

   
    <p class="highlight">
        Upcoming Event: Music Festival 2026
    </p>

    <p>
        Early registration closes soon.
    </p>

    <p class="highlight">
        Limited seats available!
    </p>

</body>

</html>
