<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Community Event Gallery</title>

    <style>

        .event-image {
            border: 3px solid black;
            padding: 5px;
            width: 200px;
            height: 150px;
        }

        table {
            margin: auto;
        }

        td {
            text-align: center;
            padding: 15px;
        }

    </style>

</head>

<body>

    <h1 align="center">Community Event Gallery</h1>

    <table>

        
        <tr>

            <td>
                <img src="https://picsum.photos/200/150?1"
                     alt="Music Festival"
                     title="Music Festival 2026"
                     class="event-image">

                <p>Music Festival</p>
            </td>

            <td>
                <img src="https://picsum.photos/200/150?2"
                     alt="Food Fair"
                     title="Food Fair Event"
                     class="event-image">

                <p>Food Fair</p>
            </td>

            <td>
                <img src="https://picsum.photos/200/150?3"
                     alt="Sports Meet"
                     title="Annual Sports Meet"
                     class="event-image">

                <p>Sports Meet</p>
            </td>

        </tr>

       
        <tr>

            <td>
                <img src="https://picsum.photos/200/150?4"
                     alt="Dance Program"
                     title="Dance Celebration"
                     class="event-image">

                <p>Dance Program</p>
            </td>

            <td>
                <img src="https://picsum.photos/200/150?5"
                     alt="Book Exhibition"
                     title="Book Exhibition"
                     class="event-image">

                <p>Book Exhibition</p>
            </td>

            <td>
                <img src="https://picsum.photos/200/150?6"
                     alt="Art Competition"
                     title="Community Art Competition"
                     class="event-image">

                <p>Art Competition</p>
            </td>

        </tr>

    </table>

</body>

</html>
